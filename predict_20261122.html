<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Private</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--line:#dde5e0;--soft:#edf1ee;--chip:#e8eee9;--ink:#17201b;--sub:#55615a;--acc:#15803d;--cool:#4f78a3;--buybg:#e7f5ec;--red:#c62828}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
button{font-family:inherit;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.top h1{margin:0;font-size:20px;font-weight:900}.top span{font-size:12px;color:var(--sub)}
.places{display:flex;gap:6px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:22px;padding:0 18px;height:36px;font-size:14px}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.races{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.rb{position:relative;flex:none;min-width:46px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:700}
.rb.on{background:var(--acc);border-color:var(--acc);color:#fff}.rb i{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--acc)}.rb.on i{background:#fff}
.rlist{display:none}
.race{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.rh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ts{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:#fff;background:#3f9b57;border-radius:9px;padding:1px 8px;vertical-align:1px}
.cinfo{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--soft)}
.cmap svg{display:block;width:100%;height:auto}
.cstat{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}.cttl{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--ink)}
.tile{background:var(--bg);border-radius:10px;padding:8px 12px}.tile small{display:block;font-size:11px;color:var(--sub)}
.tile b{font-size:22px;font-weight:900;letter-spacing:.01em}.tile span{font-size:11px;color:var(--sub);margin-left:4px}
.tile.g small{color:var(--acc);font-weight:700}.tile.h small{color:#8a5a1e;font-weight:700}
.cnote{grid-column:1/-1;font-size:11px;color:var(--sub);line-height:1.6}
.race h2{margin:0;font-size:18px;font-weight:900}.race p{margin:2px 0 0;font-size:12px;color:var(--sub)}
.bc{text-align:right;flex:none}.bc small{display:block;font-size:11px;color:var(--sub)}.bc b{font-size:20px;font-weight:900;color:var(--acc)}
.waku{width:22px;height:30px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:1px solid transparent}
.w1{background:#fff;color:#111;border-color:#bfc7c2}.w2{background:#222;color:#fff}.w3{background:#e0332b;color:#fff}.w4{background:#2a63c9;color:#fff}
.w5{background:#f5d327;color:#111}.w6{background:#2e9a4a;color:#fff}.w7{background:#f28c1e;color:#111}.w8{background:#f19ab8;color:#111}.w0{background:var(--chip);color:var(--sub)}
.uma{width:30px;height:30px;border-radius:8px;background:var(--chip);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:15px}
.l1{display:flex;align-items:center;gap:5px;min-width:0}.name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:none;font-size:10px;font-weight:900;color:#fff;background:var(--red);border-radius:4px;padding:1px 5px}
.j,.k,.st{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b{display:flex;align-items:center;gap:4px;min-width:0}.tr{flex:1;min-width:16px;height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
.tr i{display:block;height:100%;border-radius:3px}.tr .ai{background:var(--cool)}.tr .pb{background:var(--acc)}
.b span{flex:none;width:30px;text-align:right;font-size:11px;color:var(--sub)}.b span.pbv{color:var(--ink);font-weight:700}
.ev{font-size:20px;font-weight:900;line-height:1.1;text-align:right}.row.buy .ev{color:var(--acc)}
.od{display:flex;justify-content:flex-end;align-items:center;gap:2px;font-size:11px;color:var(--sub)}
.od input{width:46px;padding:2px 3px;border:1px solid var(--line);border-radius:5px;font-size:12px;text-align:right;background:var(--card);color:var(--ink);font-family:inherit}
.sortbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 8px;font-size:12px;color:var(--sub)}
.sb{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:0 12px;height:32px;font-size:13px}
.sb.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.cols-pc .sk{cursor:pointer;user-select:none}.cols-pc .sk:hover{color:var(--ink)}.cols-pc .sk.on{color:var(--acc);font-weight:700}
.legend{display:grid;grid-template-columns:56px 1fr;gap:5px 8px;margin:16px 2px 0;font-size:12px;color:var(--sub)}.legend dt{font-weight:700;color:var(--ink)}.legend dd{margin:0}
.legend .c1{color:var(--cool)}.legend .c2{color:var(--acc)}
.foot{margin:14px 2px 32px;font-size:12px;color:var(--sub)}.foot a{color:var(--acc)}

/* ---------- 出馬表 / 馬柱 の切り替え ---------- */
.vt{display:flex;background:var(--chip);border-radius:12px;padding:4px;gap:4px;margin:0 0 10px}
.vt button{flex:1;border:0;background:transparent;color:var(--sub);border-radius:9px;height:40px;font-size:14px;font-weight:700}
.vt button.on{background:var(--acc);color:#fff}
/* 馬柱 共通 */
.fn{flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;font-weight:900;background:var(--chip);color:var(--sub);border:1px solid var(--chip)}
.fn.f1{background:#f5c518;border-color:#f5c518;color:#17201b}.fn.f2{background:#2f6fd6;border-color:#2f6fd6;color:#fff}.fn.f3{background:#b42318;border-color:#b42318;color:#fff}
.rc.f1,.ur.f1{background:#fff8d9}.rc.f2,.ur.f2{background:#eaf1ff}.rc.f3,.ur.f3{background:#fdede6}
.gr{flex:none;font-size:10px;font-weight:900;color:#fff;border-radius:3px;padding:0 4px;background:#6b7280}
.gr.G1{background:#2a63c9}.gr.G2{background:#e5484d}.gr.G3{background:#2e8a4a}.av{font-size:11px;font-weight:700;color:var(--sub);margin-left:4px;white-space:nowrap}.av.fast{color:var(--acc)}.av small{font-size:9px;font-weight:500;margin-right:1px}
.recs{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;margin:2px 0}
.rec{white-space:nowrap}.rec i{font-style:normal;color:var(--sub);margin-right:3px}.rec b{font-weight:500;font-variant-numeric:tabular-nums}
.rec b.p{font-weight:700}.rec b.w{font-weight:700;color:var(--acc)}
.mkb{flex:none;width:26px;height:26px;border-radius:6px;border:1.5px solid #c9d1cc;background:#fff;color:#fff;font-size:16px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;padding:0;margin-right:6px;vertical-align:middle;cursor:pointer;line-height:1}
.mkb.on{background:#e25555;border-color:#e25555}.mkb.x{background:#6b7280;border-color:#6b7280}
#mkp{position:fixed;z-index:50;display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
#mkp[hidden]{display:none}
#mkp button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:900;color:#17201b}
#mkp button.on{background:#e25555;color:#fff;border-color:#e25555}#mkp button.clr{width:auto;padding:0 10px;font-size:12px;color:#17201b}
.gone,.row.gone,.row.gone.buy,.ubr.gone .rc,.ubr.gone .ubl div,.uc.gone .uch,.uc.gone .ur,.uc.gone .rest,.mtr.gone,.mtc.gone{background:#e3e6e4!important}
.row.gone,.uc.gone,.mtc.gone{border-color:#cfd5d1!important;box-shadow:none!important}.gone .name{color:#6b7280}
.hm{flex:none;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;font-size:11px;font-weight:900;color:#374151;border:1.5px solid #374151;margin-right:4px;vertical-align:2px;line-height:1}
.hm.c{border-radius:50%}.hm.s{border-radius:2px}
.fm{display:inline-block;font-size:10px;font-weight:700;color:#be185d;background:#fdf2f8;border:1px solid #f9a8d4;border-radius:3px;padding:0 4px;line-height:1.5;vertical-align:1px}
.gr.cl{background:#fff;color:var(--sub);border:1px solid var(--line);font-weight:700}
.ur1 b.n2{font-size:13px}.ur1 b.n3{font-size:12px;letter-spacing:-.3px}
.f3{flex:none;border-radius:4px;padding:0 5px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:500}
.f3.r1{background:#fde68a;border-color:#d4a600;font-weight:900}.f3.r2{background:#cfe0fb;border-color:#2f6fd6;font-weight:900}.f3.r3{background:#fbd5c8;border-color:#e2471f;font-weight:900}
.lay{color:#6d28d9;font-weight:700}
.silk{display:block;width:34px;height:34px;object-fit:contain}
.ubj{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;text-align:center;padding:9px 4px;border-left:1px solid var(--soft)}
.ubj b{word-break:keep-all}.ubj small{font-size:12px;color:var(--sub)}
.ped{font-size:12px;line-height:1.5}.ped i{font-style:normal;color:var(--sub)}
.ped div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ped .bms{padding-left:1.2em}
.uw{display:flex;justify-content:center;padding-top:10px;font-size:12px;font-weight:700;border:0;border-radius:0}
.uu{display:flex;justify-content:center;padding-top:9px;font-size:15px;font-weight:900}
.uname{display:flex;align-items:center;gap:6px;min-width:0}.uname .name{font-size:15px}
.unote{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uev{font-size:12px;display:flex;flex-wrap:wrap;gap:2px 10px}.buy .uev b.e{color:var(--acc)}
.uw.w1{box-shadow:inset 0 0 0 1px #bfc7c2}
.empty{padding:24px;text-align:center;color:var(--sub);font-size:13px}
/* 持ちタイム */
.mtbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 10px}
.mtnote{font-size:12px;color:var(--sub)}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--sub);border-radius:8px;height:34px;padding:0 14px;font-size:13px;font-weight:700}
.seg button.on{background:#fff;color:var(--acc);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.mtt.sub{font-size:15px;font-weight:700}.mtav.on .av{font-size:16px}.mtc2 .mtt .av{font-size:18px;margin:0}
.mth span.on{color:var(--acc);font-weight:700}
.mw{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:26px;border-radius:6px;font-size:14px;font-weight:900;border:1px solid transparent}
.mtn{display:flex;align-items:center;gap:8px;min-width:0}.mtn .name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtt{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.mtd{font-size:13px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}.mtd.z{color:var(--acc)}
.mtnone{color:var(--sub);font-size:12px}
.mw.w1{border-color:#bfc7c2}.mt .av small,.mtc .av small{display:none}.mtc .av{margin-left:0}
.mtr .fn,.mtc .fn{width:32px;height:32px;font-size:16px}
.t1{background:#fff8d9}.t2{background:#eaf1ff}.t3{background:#fdede6}
/* ---------- スマホ (〜899px) ---------- */
@media (max-width:899px){
 .mtbar{gap:8px}.seg button{padding:0 10px;font-size:12.5px}
 .mtc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center}
 .mtc.t1{background:#fff8d9}.mtc.t2{background:#eaf1ff}.mtc.t3{background:#fdede6}
 .mtc1{min-width:0;display:flex;flex-direction:column;gap:3px}.mts{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mts b{color:var(--ink)}
 .mtc2{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
 /* 馬柱 (スマホ): 1頭ずつのカード */
 .uc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
 .uc.buy{border-color:var(--acc)}
 .uch{display:grid;grid-template-columns:18px 26px minmax(0,1fr) 64px;border-bottom:1px solid var(--soft)}.uc.buy .uch{background:#f1f9f4}
 .uci{padding:9px 6px 9px 2px;display:flex;flex-direction:column;gap:3px;min-width:0}.uname .name{font-size:16px}
 .rest{background:#ede9fe;color:#5b21b6;text-align:center;font-size:12px;font-weight:700;padding:5px 0;letter-spacing:2px;border-bottom:1px solid #ddd6fe}
 .ur{padding:8px 10px;border-bottom:1px solid var(--soft);display:grid;grid-template-columns:30px minmax(0,1fr) auto;column-gap:8px;row-gap:3px;align-items:center}
 .ur:last-child{border-bottom:0}
 .ur .fn{grid-row:span 2;width:30px;height:30px;font-size:15px}
 .ur1{min-width:0;display:flex;align-items:center;gap:5px}.ur1 small{flex:none;font-size:11px;color:var(--sub);white-space:nowrap}
 .ur1 b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .urc{font-size:13px;text-align:right;white-space:nowrap}.urt{font-size:13px;font-weight:700;text-align:right}
 .urs{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .ur3{grid-column:2/4;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);min-width:0}
 .ur3 .ot{margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ur3 .ot span{color:var(--ink)}
 header{padding:16px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:3}
 .side{display:contents}.side .places{display:none}
 .content{padding:12px 12px 0}
 .race{margin-bottom:8px}
 .cols-pc{display:none}
 .cols-sp,.row{display:grid;grid-template-columns:22px 30px minmax(0,1fr) 76px 58px;column-gap:6px;align-items:center}
 .cols-sp{padding:0 8px 6px;font-size:11px;color:var(--sub)}.cols-sp span:last-child{text-align:right}
 .list{display:flex;flex-direction:column;gap:6px}
 .row{grid-template-areas:"wk um l1 bars ev" "wk um jk bars od" "wk um st bars od";padding:8px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
 .row.buy{background:var(--buybg);border-color:var(--acc)}
 .waku{grid-area:wk}.uma{grid-area:um}.l1{grid-area:l1}.jk{grid-area:jk;display:flex;gap:4px;min-width:0}.st{grid-area:st}
 .bars{grid-area:bars;display:flex;flex-direction:column;gap:5px}.ev{grid-area:ev}.od{grid-area:od}
 .legend div{display:contents}
}
/* ---------- PC (900px〜) ---------- */
@media (min-width:900px){
 header{max-width:1320px;margin:0 auto;padding:16px 28px;display:flex;flex-direction:column}
 .hb{background:var(--card);border-bottom:1px solid var(--line)}
 header .places,header .races{display:none}
 .layout{max-width:1320px;margin:0 auto;padding:20px 28px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
 .side{position:sticky;top:12px;display:flex;flex-direction:column;gap:8px}.side .pill{flex:1}
 .rlist{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
 .ri{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:8px 12px;min-height:44px;border:0;border-bottom:1px solid var(--soft);background:var(--card);color:var(--ink);text-align:left}
 .ri:last-child{border-bottom:0}.ri.on{background:var(--acc);color:#fff}.ri b{font-size:15px;font-weight:900}
 .ri .rn{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ri small{font-size:11px;opacity:.8}
 .ri em{font-style:normal;font-size:11px;font-weight:900;color:#fff;background:var(--red);border-radius:4px;padding:1px 6px}
 .race{padding:16px 18px;margin-bottom:12px}.race h2{font-size:24px}.race p{font-size:13px}.bc b{font-size:24px}
 .cinfo{grid-template-columns:minmax(0,400px) minmax(0,1fr);align-items:center;gap:20px}
 .cols-sp{display:none}
 .tbl{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
 .cols-pc,.row{display:grid;grid-template-columns:28px 34px minmax(88px,1.7fr) minmax(62px,1fr) 38px minmax(76px,1.4fr) minmax(70px,1fr) minmax(70px,1fr) 56px 60px;column-gap:8px;align-items:center;padding:8px 12px}
 .cols-pc{padding:10px 12px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line)}.cols-pc .r{text-align:right}
 .row{grid-template-areas:"wk um l1 j k st bai bpb od ev";border-bottom:1px solid var(--soft);background:var(--card)}.row:last-child{border-bottom:0}
 .row.buy{background:var(--buybg);box-shadow:inset 3px 0 0 var(--acc)}
 .waku{grid-area:wk;width:24px;height:26px}.uma{grid-area:um}.l1{grid-area:l1}.jk,.bars{display:contents}
 .j{grid-area:j;font-size:14px;color:var(--ink)}.k{grid-area:k;font-size:12px}.st{grid-area:st;font-size:13px}
 .bai{grid-area:bai}.bpb{grid-area:bpb}.b span{width:34px;font-size:12px}.tr{height:6px}
 .od{grid-area:od}.od small{display:none}.od input{width:52px;font-size:14px}.ev{grid-area:ev;font-size:19px}
 .badge{font-size:11px;padding:1px 6px}
 .legend{display:flex;flex-wrap:wrap;gap:6px 20px}.legend div{display:flex;gap:6px}
 /* 馬柱 (PC): 画面いっぱいに広げる */
 body.wide header,body.wide .layout{max-width:none}
 body.wide .layout{grid-template-columns:180px minmax(0,1fr);padding:20px 24px}
 .vt{display:inline-flex}.vt button{flex:none;padding:0 22px}
 .ub{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
 .ubh,.ubr{display:grid;grid-template-columns:20px 28px minmax(150px,.9fr) 118px 26px repeat(5,minmax(0,1.3fr))}
 .ubh{font-size:12px;color:var(--sub);border-bottom:1px solid var(--line);background:#fafcfb;white-space:nowrap}
 .ubh span{padding:8px 10px;border-left:1px solid var(--soft)}.ubh span:nth-child(-n+3){border-left:0}.ubh span:nth-child(-n+2){padding:8px 0;text-align:center}
 .ubr{border-bottom:1px solid var(--line)}.ubr:last-child{border-bottom:0}.ubr.buy{background:#f1f9f4}
 .ubi{padding:9px 10px 9px 4px;display:flex;flex-direction:column;gap:4px;min-width:0}
 .ubl{border-left:1px solid var(--soft);display:flex}
 .ubl div{flex:1;background:#ede9fe;color:#5b21b6;display:flex;align-items:center;justify-content:center}
 .ubl em{font-style:normal;writing-mode:vertical-rl;text-orientation:upright;font-size:12px;font-weight:700;letter-spacing:1px}
 .ubl em span{text-combine-upright:all}
 .rc{border-left:1px solid var(--soft);padding:8px;display:flex;flex-direction:column;gap:3px;min-width:0;font-size:11px}
 .rc1{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 4px;color:var(--sub)}.rc1 span{white-space:nowrap}
 .rc2{display:flex;align-items:center;gap:4px;min-width:0}.rc2 .fn{min-width:28px;height:28px;padding:0 3px;font-size:15px}
 .rc2 b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .rcs{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rcs span{color:var(--ink)}
 .rc4{white-space:nowrap}.rc4 b{font-size:12px}
 .rc6{display:flex;align-items:center;gap:5px}.rc6 span:first-child{color:var(--sub);white-space:nowrap}.rc6 .f3{margin-left:auto}
 /* 持ちタイム (PC) */
 .mt{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
 .mth,.mtr{display:grid;grid-template-columns:56px minmax(180px,1.3fr) 100px 100px 60px minmax(220px,1.6fr) minmax(200px,1.4fr);align-items:center;column-gap:12px;padding:0 16px}

<script>

const PKEY="keiba_ai_pw";
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function decrypt(e,pw){
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(e.salt),iterations:e.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(e.iv)},key,b64(e.ct));
 return JSON.parse(new TextDecoder().decode(pt));}
function getPw(){try{return localStorage.getItem(PKEY)}catch(e){return null}}
function setPw(v){try{v?localStorage.setItem(PKEY,v):localStorage.removeItem(PKEY)}catch(e){}}
function showErr(e){const m=document.createElement("pre");m.style.cssText="margin:16px;padding:12px;background:#fdecec;color:#b42318;white-space:pre-wrap;font-size:13px";
 m.textContent="ページの表示でエラーが起きました。この画面のスクリーンショットを送ってください。\n"+(e&&e.stack||e);document.body.prepend(m)}
function run(onData,d){try{onData(d)}catch(e){showErr(e)}}
async function unlock(onData){
 let P;try{P=JSON.parse(document.getElementById("payload").textContent)}catch(e){showErr(e);return}
 if(P.plain){run(onData,P.plain);return}
 const lock=document.getElementById("lock"),app=document.getElementById("app");
 const tryPw=async pw=>{let d;try{d=await decrypt(P.enc,pw)}catch(e){return false}lock.hidden=true;app.hidden=false;run(onData,d);return true};
 const saved=getPw();if(saved&&await tryPw(saved))return;
 setPw(null);lock.hidden=false;document.getElementById("pw").focus();
 document.getElementById("lf").onsubmit=async ev=>{ev.preventDefault();const pw=document.getElementById("pw").value;
  document.getElementById("err").textContent="確認中...";
  if(await tryPw(pw)){if(document.getElementById("rm").checked)setPw(pw)}else document.getElementById("err").textContent="パスワードが違います";};}

let D,places,curP,curR=0,cur;const odds={};
const SORTS=[["uma","馬番",1],["ai","AI",-1],["pb","総合",-1],["odds","単勝",1],["ev","期待値",-1]];
let sortKey="uma",sortDir=1;
function setSort(k){if(k===sortKey)sortDir=-sortDir;else{sortKey=k;sortDir=SORTS.find(x=>x[0]===k)[2]}render()}
function arrow(k){return k===sortKey?(sortDir>0?" ▲":" ▼"):""}const PC=window.matchMedia("(min-width:900px)");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function key(r,h){return r.place+r.num+"-"+h.uma+"-"+h.name}
function start(data){
 D=data;document.title="競馬AI予想 "+D.date;
 const d=new Date(D.date+"T00:00:00"),W="日月火水木金土";
 document.getElementById("d").textContent=`${d.getMonth()+1}/${d.getDate()} (${W[d.getDay()]})`+(D.odds_time?`・オッズ ${D.odds_time.slice(11,16)} 時点`:"・オッズ未発売");
 document.getElementById("evn").textContent=D.ev;
 let f=D.odds_time?"":"オッズ発売後に予想を実行し直すと、総合と「買い」が出ます。";
 if(location.protocol.startsWith("http"))f+=(f?"<br>":"")+'<a href="./">← 日付一覧</a>';
 document.getElementById("foot").innerHTML=f;
 D.races.forEach(r=>r.horses.forEach(h=>{if(h.odds)odds[key(r,h)]=String(h.odds)}));
 places=[...new Set(D.races.map(r=>r.place))];curP=places[0];render();
 PC.addEventListener?PC.addEventListener("change",render):PC.addListener(render);}
function calc(r){ // 市場の勝率に AI の補正 (f) を足し、検証期間で決めた割合で市場と混ぜる
 if(r.horses.some(h=>h.f===null||h.f===undefined))return null;

function courseSVG(c){

 // 競馬場ごとのコース (スタジアム形)。走る向きに沿って u=0 がホームストレッチの始まり (4角出口)
 const loop=(lp,r)=>{const xl=lp.xl,xr=lp.xr,L=xr-xl,A=Math.PI*r,P=2*L+2*A;
  const at=u=>{u=((u%P)+P)%P;let t,th;

   if(u<L)return[xr-u,cy+r];if(u<L+A){t=(u-L)/r;th=Math.PI/2+t;return[xl+r*Math.cos(th),cy+r*Math.sin(th)]}
   if(u<2*L+A)return[xl+(u-L-A),cy-r];t=(u-2*L-A)/r;th=-Math.PI/2+t;return[xr+r*Math.cos(th),cy+r*Math.sin(th)]};
  const line=(a,b)=>{const n=Math.max(2,Math.ceil((b-a)/3));let d="";for(let i=0;i<=n;i++){const q=at(a+(b-a)*i/n);d+=(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)}return d};

  const uAt=(seg,f)=>ss[seg]+f*sl[seg];

 const main=Lp.main,gx=main.at(c.goal_f*main.L)[0];
 let g="";
 // コース (芝: 外回り → 内回り、ダート)
 const op=on=>on?1:.35;
 g+=`<g opacity="${op(turf)}">`;                         // 芝 (重なる部分の色ムラが出ないよう、まとめて薄くする)
 if(c.has_straight1000)g+=`<line x1="6" y1="${cy+RT}" x2="${(Lp.out||main).xl}" y2="${cy+RT}" stroke="${tc}" stroke-width="13"/>`;
 ["out","main"].forEach(k=>{if(Lp[k])g+=`<path d="${Lp[k].line(0,Lp[k].P)}Z" fill="none" stroke="${tc}" stroke-width="13" stroke-linejoin="round"/>`});
 g+=`</g>`;
 g+=`<path d="${Lp.dirt.line(0,Lp.dirt.P)}Z" fill="none" stroke="${dc}" stroke-width="11" stroke-linejoin="round" opacity="${op(!turf)}"/>`;
 // 走るコースと発走地点
 const a=Lp[c.loop]||(turf?main:Lp.dirt),k=a.P/c.lap,ug=a.uX(gx),dist=c.dist*k;

 if(c.straight1000){S=[8,cy+RT];route=`M${S[0]} ${S[1]}L${gx.toFixed(1)} ${cy+RT}`;G=[gx,cy+RT]}
 else if(c.start){
  const sp=c.start,uj=a.uAt(sp.seg,sp.f),J=a.at(uj),chute=sp.dx!=null;
  const cl=chute?Math.hypot(sp.dx,sp.dy):0,len0=((ug-uj)%a.P+a.P)%a.P,laps=Math.max(0,Math.round((dist-cl-len0)/a.P));
  route=a.line(uj,uj+len0+laps*a.P);
  if(chute){S=[J[0]+sp.dx,J[1]+sp.dy];
   const cc=sp.turf_start?tc:(turf?tc:dc);
   g+=`<line x1="${S[0].toFixed(1)}" y1="${S[1].toFixed(1)}" x2="${J[0].toFixed(1)}" y2="${J[1].toFixed(1)}" stroke="${cc}" stroke-width="${turf||sp.turf_start?13:11}" stroke-linecap="round"/>`;
   if(sp.turf_start)g+=`<line x1="${S[0].toFixed(1)}" y1="${S[1].toFixed(1)}" x2="${J[0].toFixed(1)}" y2="${J[1].toFixed(1)}" stroke="#fff" stroke-width="1" stroke-dasharray="3 3" opacity=".8"/>`;
   route=`M${S[0].toFixed(1)} ${S[1].toFixed(1)}`+route.replace(/^M/,"L");
  }else S=J;
 }else{const us=ug-dist;route=dist>=a.P?a.line(0,a.P)+"Z":a.line(us,ug);S=a.at(us)}

 // ゴール板
 g+=`<line x1="${gx.toFixed(1)}" y1="${cy+RT+9}" x2="${gx.toFixed(1)}" y2="${cy+RT+16}" stroke="#17201b" stroke-width="2"/>`;
 // 走る向き (向こう正面の上)
 const ax=(main.xl+main.xr)/2,ay=cy-RT-14;

 g+=`<text x="${tx}" y="${c.turf_start?99:105}" text-anchor="middle" font-size="11" fill="#55615a">${c.dir}回り${c.io?"・"+c.io+"回り":""}${c.straight1000?"・直線":""}</text>`;
 if(c.turf_start)g+=`<rect x="${tx-29}" y="105" width="58" height="16" rx="8" fill="${tc}"/><text x="${tx}" y="116.5" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">芝スタート</text>`;

   ${b?`<b class="mtt${mtKey==="t"?"":" sub"}">${ESC(b.tm)}</b><span class="mtav${mtKey==="av"?" on":""}">${AV(b.bav)||'<span class="mtnone">-</span>'}</span>${diff(x)}
   <span class="mtr2">${mtKey==="av"&&s?`<b>${ESC(s.tm)}</b> `:""}${recTxt(s)} <small>(${b.n}回走)</small></span>`
   :`<span class="mtnone" style="grid-column:3/7">${none}</span>`}
   <span class="mtr2">${o?`<b>${ESC(o.tm)}</b> ${recTxt(o)}`:'<span class="mtnone">記録なし</span>'}</span></div>`}).join("")+`</div>`;
 }else{
  html+=rows.map(x=>{const b=x.b,s=shown(x),o=x.o;return `<div class="mtc ${x.rank&&x.rank<=3?"t"+x.rank:""}${GONE(r,x.h)}">${rk(x)}
   <div class="mtc1"><div class="mtn">${wk(x.h)}${nm(x)}</div>
   ${b?`<div class="mts">${recTxt(s)}・${b.n}回走</div><div class="mts">${mtKey==="t"?`平均比 ${AV(b.bav)||"-"}`:`持ちタイム <b>${ESC(b.tm)}</b>`}${o?`　${mtScope==="all"?ESC(r.place):"全場"} <b>${ESC(o.tm)}</b>`:""}</div>`
   :`<div class="mts mtnone">${none}</div>`}</div>
   ${b?`<div class="mtc2">${mtKey==="t"?`<b class="mtt">${ESC(b.tm)}</b>`:`<b class="mtt">${AV(b.bav)||"-"}</b>`}${diff(x)}</div>`:""}</div>`}).join("");
 }
 document.getElementById("mt").innerHTML=html;}
function render(){
 const r=renderNav();cur=r;
 document.querySelectorAll("#vt button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
 document.getElementById("vTbl").hidden=view!=="tbl";document.getElementById("vUma").hidden=view!=="uma";document.getElementById("vMt").hidden=view!=="mt";
 document.body.classList.toggle("wide",view==="uma"||view==="mt");
 document.getElementById("rt").textContent=`${r.place}${r.num}R ${r.name}`;
 document.getElementById("rs").innerHTML=esc([r.course,r.horses.length+"頭",r.track,r.post?r.post+"発走":""].filter(Boolean).join("・"));
 renderCourse(r);
 // 並び替え (最初は馬番順。ボタンや見出しで切り替え、同じものをもう一度押すと逆順)
 document.getElementById("sortbar").innerHTML="並び替え"+SORTS.map(([k,l])=>`<button class="sb ${k===sortKey?"on":""}" onclick="setSort('${k}')">${l}${arrow(k)}</button>`).join("");
 const H=[["",""],["uma","馬番"],["","馬名"],["","騎手"],["","斤量"],["","厩舎"],["ai","AI勝率%"],["pb","総合%"],["odds","単勝"],["ev","期待値"]];
 document.getElementById("colspc").innerHTML=H.map(([k,l],i)=>{const r=i>=8?" r":"";const t=i===0?"枠":l;
  return k?`<span class="sk${r}${k===sortKey?" on":""}" onclick="setSort('${k}')">${t}${arrow(k)}</span>`:`<span class="${r.trim()}">${t}</span>`}).join("");
 const res0=calc(r);
 const val=i=>{const h=r.horses[i],x=res0&&res0[i];
  return {uma:h.uma,ai:h.p,pb:x?x.pb:null,odds:parseFloat(odds[key(r,h)])||null,ev:x?x.ev:null}[sortKey]};
 const idx=r.horses.map((h,i)=>i).sort((a,b)=>{const va=val(a),vb=val(b);
  if(va==null&&vb==null)return (r.horses[a].uma??99)-(r.horses[b].uma??99);if(va==null)return 1;if(vb==null)return -1;
  return (va-vb)*sortDir||(r.horses[a].uma??99)-(r.horses[b].uma??99)});
 document.getElementById("list").innerHTML=idx.map(i=>{const h=r.horses[i];return `<div class="row${GONE(r,h)}" id="row${i}">
  <span class="waku w${h.waku??0}">${h.waku??"-"}</span><span class="uma">${h.uma??"-"}</span>
  <div class="l1">${MB(r,h)}${MK(h)}<span class="name">${esc(h.name)}</span><span class="badge" hidden>買い</span></div>
  <div class="jk"><span class="j">${esc(h.jockey)}</span><span class="k">${h.kinryo??""}</span></div>
  ${(t=>`<span class="st" title="${t}">${t}</span>`)(esc([h.belong,h.trainer?h.trainer+"厩舎":""].filter(Boolean).join("・")))}
  <div class="bars"><div class="b bai"><div class="tr"><i class="ai"></i></div><span>${(h.p*100).toFixed(1)}</span></div>
   <div class="b bpb"><div class="tr"><i class="pb"></i></div><span class="pbv">-</span></div></div>
  <div class="ev">-</div><label class="od"><small>単</small><input inputmode="decimal" value="${esc(odds[key(r,h)]??"")}" data-k="${esc(key(r,h))}" placeholder="-"></label></div>`}).join("");
 document.querySelectorAll("#list input").forEach(el=>el.addEventListener("input",()=>{odds[el.dataset.k]=el.value;upd();renderNav()}));
 upd();if(view==="uma")renderUma(r);if(view==="mt")renderMt(r);}
function upd(){
 const res=calc(cur),mx=Math.max(...cur.horses.map((h,i)=>Math.max(h.p,res?res[i].pb:0)));let n=0;
 cur.horses.forEach((h,i)=>{const row=document.getElementById("row"+i),x=res&&res[i],buy=!!x&&x.ev>=D.ev;if(buy)n++;
  row.classList.toggle("buy",buy);row.querySelector(".badge").hidden=!buy;
  row.querySelector(".ai").style.width=(h.p/mx*100)+"%";
  row.querySelector(".pb").style.width=x?(x.pb/mx*100)+"%":"0";
  row.querySelector(".pbv").textContent=x?(x.pb*100).toFixed(1):"-";
  row.querySelector(".ev").textContent=x?x.ev.toFixed(2):"-";});
 document.getElementById("bn").textContent=res?n+"頭":"-";}
unlock(start);
</script></body></html>
