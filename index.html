<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Private</title>
<style>
body{margin:0;background:#f4f7f5;color:#17201b;font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
main{max-width:520px;margin:auto;padding:20px 16px}main h1{font-size:20px;margin:0 0 14px}
main a{display:flex;justify-content:space-between;background:#fff;border:1px solid #e4e2dc;border-radius:10px;
padding:14px 16px;margin-bottom:8px;color:inherit;text-decoration:none;font-size:16px}
main a:first-of-type{border-color:#15803d;border-width:2px}main a span{color:#6b6a66}

#lock,#lock *{box-sizing:border-box}
#lock{max-width:360px;margin:18vh auto 0;padding:0 20px;text-align:center;font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
#lock h1{font-size:18px;margin:0 0 14px}#lock input{width:100%;padding:12px;font-size:16px;border:1px solid #d6d3cc;border-radius:10px;text-align:left}
#lock button{width:100%;margin-top:10px;padding:12px;font-size:16px;border:0;border-radius:10px;background:#15803d;color:#fff}
#lock label{display:block;margin-top:10px;font-size:13px;color:#6b6a66}#lock .err{color:#b4471f;font-size:13px;min-height:1.4em;margin-top:8px}

</style></head><body>
<div id="lock" hidden><h1>パスワードを入力</h1>
<form id="lf"><input id="pw" type="password" autocomplete="current-password" placeholder="パスワード">
<label><input id="rm" type="checkbox" checked style="width:auto"> このブラウザで覚えておく</label>
<button type="submit">開く</button><div class="err" id="err"></div></form></div>
<main id="app" hidden><h1>競馬AI予想</h1><div id="list"></div></main>
<script id="payload" type="application/json">{"enc": {"salt": "XliRAUKuOMgqUAXAC5U/Aw==", "iv": "3WfyLc519h76CxGn", "ct": "8vaI25EPOvFe/kHl7sxfL+XFgPy35RZhDpseVRyhrDZuSsPIQayyCZl4IfP+Cmuw6roZ", "iter": 300000}}</script>
<script>

const PKEY="keiba_ai_pw";
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function decrypt(e,pw){
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(e.salt),iterations:e.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(e.iv)},key,b64(e.ct));
 return JSON.parse(new TextDecoder().decode(pt));}
function getPw(){try{return localStorage.getItem(PKEY)}catch(e){return null}}
function setPw(v){try{v?localStorage.setItem(PKEY,v):localStorage.removeItem(PKEY)}catch(e){}}
function showErr(e){const m=document.createElement("pre");m.style.cssText="margin:16px;padding:12px;background:#fdecec;color:#b42318;white-space:pre-wrap;font-size:13px";
 m.textContent="ページの表示でエラーが起きました。この画面のスクリーンショットを送ってください。\n"+(e&&e.stack||e);document.body.prepend(m)}
function run(onData,d){try{onData(d)}catch(e){showErr(e)}}
async function unlock(onData){
 let P;try{P=JSON.parse(document.getElementById("payload").textContent)}catch(e){showErr(e);return}
 if(P.plain){run(onData,P.plain);return}
 const lock=document.getElementById("lock"),app=document.getElementById("app");
 const tryPw=async pw=>{let d;try{d=await decrypt(P.enc,pw)}catch(e){return false}lock.hidden=true;app.hidden=false;run(onData,d);return true};
 const saved=getPw();if(saved&&await tryPw(saved))return;
 setPw(null);lock.hidden=false;document.getElementById("pw").focus();
 document.getElementById("lf").onsubmit=async ev=>{ev.preventDefault();const pw=document.getElementById("pw").value;
  document.getElementById("err").textContent="確認中...";
  if(await tryPw(pw)){if(document.getElementById("rm").checked)setPw(pw)}else document.getElementById("err").textContent="パスワードが違います";};}

unlock(d=>{document.title="競馬AI予想";const W="日月火水木金土";
 document.getElementById("list").innerHTML=d.dates.length?d.dates.map(s=>{const t=new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6));
  return `<a href="predict_${s}.html">${t.getFullYear()}年${t.getMonth()+1}月${t.getDate()}日<span>${W[t.getDay()]}</span></a>`}).join(""):"<p>まだ予想がありません</p>";});
</script></body></html>
